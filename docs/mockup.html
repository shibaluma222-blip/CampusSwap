<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CampusSwap Mock Up</title>
<style>
:root{
  --ink:#111;--g1:#f5f5f6;--g2:#e7e7e9;--g3:#cbcbd0;--g4:#8b8b92;--g5:#55555b;--bg:#fff;
  --r:14px;--rs:10px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#d9d9dc;display:flex;align-items:center;justify-content:center;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}

#phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:9px solid #1b1b1d;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
#status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:14px;font-weight:600;flex:none}
#status .sb{display:flex;gap:5px;align-items:center}
#root{position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column}
@media (max-width:480px){
  body{background:var(--bg);display:block}
  #phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  #status{display:none}
  #root{inset:0;padding-top:env(safe-area-inset-top)}
}

.screen{display:flex;flex-direction:column;height:100%;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.footer{padding:12px 18px 20px;background:var(--bg);border-top:1px solid var(--g2);flex:none}

/* top bars */
.top{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;flex:none;min-height:50px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.3px;flex:1}
.top h2{font-size:17px;font-weight:650;flex:1;text-align:center}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--g2)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r);font-weight:600;font-size:16px;background:var(--ink);color:#fff}
.btn:active{opacity:.85}
.btn.sec{background:var(--g1);color:var(--ink);border:1px solid var(--g2)}
.btn[disabled]{background:var(--g2);color:var(--g4);cursor:not-allowed}
.btn.sm{height:42px;font-size:14px;border-radius:12px}
.row{display:flex;gap:10px}

/* inputs */
.field{display:flex;align-items:center;gap:10px;height:52px;border:1.5px solid var(--g3);border-radius:var(--r);padding:0 14px;background:#fff}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.field.err{border-color:var(--ink);background:var(--g1)}
.hint{font-size:12.5px;color:var(--g4);margin-top:8px}
.hint svg{display:inline;vertical-align:-3px;margin-right:4px}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:56px;text-align:center;font-size:22px;font-weight:600;border:1.5px solid var(--g3);border-radius:12px;outline:0;background:#fff}
.otp input:focus{border-color:var(--ink)}
.otp input.f{border-color:var(--ink);background:var(--g1)}
label.l{display:block;font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--g5)}
textarea.ta{width:100%;border:1.5px solid var(--g3);border-radius:var(--r);padding:12px 14px;font-size:15px;outline:0;resize:none;height:96px}
textarea.ta:focus{border-color:var(--ink)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 2px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0;margin:0}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--g1);border:1px solid var(--g2);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--g1);border:1px solid var(--g2);color:var(--g5)}
.tag.k{background:var(--ink);color:#fff;border-color:var(--ink)}

/* search + segmented */
.search{display:flex;align-items:center;gap:10px;height:46px;background:var(--g1);border:1px solid var(--g2);border-radius:var(--r);padding:0 14px}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.seg{display:flex;background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--g5)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* images */
.ph{background:var(--g2);display:grid;place-items:center;color:var(--g3);position:relative;overflow:hidden}
.ph svg{width:38%;height:auto;max-width:90px}
.ph .fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.ph .sv{position:absolute;left:8px;bottom:8px}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{border:1px solid var(--g2);border-radius:var(--r);overflow:hidden;background:#fff;text-align:left;display:block}
.card:active{background:var(--g1)}
.card .ph{aspect-ratio:1/0.9}
.card .b{padding:10px 11px 12px}
.card .t{font-size:14px;font-weight:600;line-height:1.25;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .p{font-size:16px;font-weight:700;margin:4px 0 7px}
.empty{grid-column:1/-1;text-align:center;color:var(--g4);padding:50px 10px;font-size:14px}

/* tab bar */
.tabs{display:flex;border-top:1px solid var(--g2);padding:8px 6px 18px;flex:none;background:#fff}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--g4);font-weight:500;position:relative}
.tabs button.on{color:var(--ink);font-weight:700}
.dot{position:absolute;top:-2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* seller card */
.seller{display:flex;align-items:center;gap:12px;border:1px solid var(--g2);border-radius:var(--r);padding:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--g2);display:grid;place-items:center;color:var(--g4);flex:none;font-weight:700;font-size:15px}
.av.s{width:36px;height:36px;font-size:13px}
.av.l{width:84px;height:84px;font-size:28px}
.meta{font-size:13px;color:var(--g5);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* chat */
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.m{max-width:76%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35}
.m.them{background:var(--g1);border:1px solid var(--g2);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{background:#55555b;color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.ts{font-size:11px;color:var(--g4);margin:0 4px 6px}
.ts.me{align-self:flex-end}
.sys{align-self:center;font-size:12px;color:var(--g5);background:var(--g1);border:1px solid var(--g2);padding:6px 12px;border-radius:999px;margin:6px 0;display:flex;gap:6px;align-items:center}
.deal{align-self:stretch;border:1.5px solid var(--ink);border-radius:16px;padding:14px;margin:8px 0;background:#fff}.deal small{display:block;font-size:11px;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;font-weight:600}.deal b{display:block;font-size:20px;margin:2px 0 10px}
.offer{align-self:flex-end;border:1.5px solid var(--ink);border-radius:16px;padding:10px 14px;min-width:150px}
.offer small{display:block;font-size:11px;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.offer b{font-size:20px}
.composer{border-top:1px solid var(--g2);padding:10px 14px 18px;flex:none}
.composer .qa{display:flex;gap:8px;margin-bottom:10px}
.composer .qa .chip{height:34px;font-size:13px;display:flex;align-items:center;gap:6px}
.mini{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--g2);background:#fff;flex:none}
.mini .ph{width:42px;height:42px;border-radius:10px}
.mini .ph svg{width:55%}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px;background:var(--g1);border-radius:18px;border:1px solid var(--g2)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g4);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;padding:10px 18px 24px;animation:up .25s ease;max-height:88%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--g3);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:4px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--g2);font-size:16px}
.opt:last-child{border:0}
.range{width:100%;accent-color:#111;margin:10px 0 4px}

/* misc list */
.list{border:1px solid var(--g2);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--g2);width:100%;text-align:left;font-size:15px}
.li:last-child{border:0}
.li:active{background:var(--g1)}
.li .s{flex:1}
.thread{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--g2);width:100%;text-align:left;align-items:center}
.thread .n{font-weight:650;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.thread .n span{font-weight:400;font-size:12px;color:var(--g4)}
.thread .pv{font-size:13.5px;color:var(--g5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--g2);border-radius:var(--r);margin-bottom:8px}
.spot.on{border-color:var(--ink);background:var(--g1)}
.spot .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--g3);margin-left:auto;flex:none}
.spot.on .rd{border:6px solid var(--ink)}
.stars{display:flex;gap:8px;justify-content:center;margin:18px 0}
.stars button{color:var(--g3)}
.stars button.on{color:var(--ink)}
.center{text-align:center}
.bigcheck{width:104px;height:104px;border-radius:50%;background:var(--g2);display:grid;place-items:center;margin:20px auto 14px}
.qrbox{width:190px;height:190px;margin:16px auto;border:1px solid var(--g2);border-radius:16px;padding:14px;background:#fff;position:relative}
.qrbox.done svg{opacity:.12}
.qrbox .ov{position:absolute;inset:0;display:grid;place-items:center}
.infocard{display:flex;gap:12px;align-items:center;border:1px solid var(--g2);border-radius:var(--r);padding:14px;text-align:left}
.infocard small{display:block;font-size:12px;color:var(--g4)}
.infocard b{font-size:15px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;animation:fade .2s;white-space:nowrap;display:flex;gap:8px;align-items:center}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--g3)}
.dots i.on{background:var(--ink)}
.logo{width:96px;height:96px;border-radius:24px;background:var(--g2);display:grid;place-items:center;margin:0 auto 14px;color:var(--g5)}
.sub{font-size:13.5px;color:var(--g5)}
.sec-t{font-size:13px;font-weight:700;color:var(--g5);letter-spacing:.4px;text-transform:uppercase;margin:22px 0 10px}
.stat{flex:1;text-align:center;border:1px solid var(--g2);border-radius:var(--r);padding:12px 4px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--g4)}
.demo{font-size:11.5px;text-align:center;color:var(--g4);margin-top:12px}
</style>
</head>
<body>
<div id="phone">
  <div id="status"><span>9:41</span><span class="sb">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="#111"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#111"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#111"/></svg>
  </span></div>
  <div id="root"></div>
</div>

<script>
/* ---------- icons ---------- */
const P={
 home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',

 star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',

const ic=(n,s=24,f='none',w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;

/* ---------- data ---------- */
const SELLERS={

};
let LISTINGS=[
 {id:1,t:'Ergonomic Study Chair',p:350,cond:'Like New',cat:'Furniture',type:'goods',s:'alex',d:'Comfortable ergonomic study chair, used for only 3 months. Great condition, no scratches. Adjustable height and lumbar support. Perfect for long study nights.',spots:['Hall Lobby','Block A Lobby'],age:'2h ago'},

 {id:3,t:'MacBook Air M1 (2021)',p:4200,cond:'Good',cat:'Electronics',type:'goods',s:'jason',d:'8GB / 256GB, battery health 87%. Comes with charger and sleeve. Minor wear on the corners. Happy to let you test it in the lobby.',spots:['Hall Lobby'],age:'1d ago'},
 {id:4,t:'LED Desk Lamp',p:60,cond:'Like New',cat:'Electronics',type:'goods',s:'priya',d:'Dimmable LED lamp with 3 colour modes and a USB charging port. Bought in August, barely used.',spots:['Block C Lobby','Mailroom'],age:'3h ago'},
 {id:5,t:'Mini Fridge (45L)',p:450,cond:'Good',cat:'Appliances',type:'goods',s:'kenji',d:'Compact fridge, fits a single room. Works perfectly, moving out so need it gone by Friday. Bring a friend to carry it.',spots:['Block B Lobby'],age:'6h ago'},
 {id:6,t:'Rice Cooker (3 cups)',p:90,cond:'Fair',cat:'Appliances',type:'goods',s:'sam',d:'Basic rice cooker with steam tray. Some scratches on the lid, works fine.',spots:['Block C Lobby','Hall Lobby'],age:'2d ago'},
 {id:7,t:'Bookshelf (5 tier)',p:220,cond:'Good',cat:'Furniture',type:'goods',s:'mei',d:'White 5 tier shelf, easy to disassemble. Holds a lot more books than you think.',spots:['Block B Lobby'],age:'1d ago'},
 {id:8,t:'Move-out Helper (carry + trolley)',p:120,unit:'/hr',cond:'Service',cat:'Moving',type:'services',s:'jason',d:'Two helpers with a trolley, can move between floors in the same hall. Book at least 1 day ahead. Minimum 1 hour.',spots:['Hall Lobby'],age:'4h ago'},
 {id:9,t:'Calculus I Tutoring',p:150,unit:'/hr',cond:'Service',cat:'Tutoring',type:'services',s:'priya',d:'Year 3 math student, got an A in MA1200. Sessions in the study lounge. First 30 minutes free for new students.',spots:['Study Lounge G/F'],age:'1d ago'},

];

const money=(p,u)=>'HK$'+p.toLocaleString('en-US')+(u||'');

/* ---------- state ---------- */
const S={
 screen:'login',hist:[],email:'',otpStage:false,err:false,
 type:'goods',cat:'All',q:'',F:{max:5000,cond:[],sort:'new'},

};

const root=document.getElementById('root');
const L=id=>LISTINGS.find(x=>x.id===id);

/* ---------- fake QR ---------- */
function qr(seed){
  let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296};
  const N=25,c=7,cells=[];
  const fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!fin(x,y)&&rnd()>.52)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}
  const f=(x,y)=>`<path fill-rule="evenodd" d="M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5z"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return`<svg viewBox="0 0 ${N} ${N}" fill="#111" shape-rendering="crispEdges">${f(0,0)}${f(N-7,0)}${f(0,N-7)}${cells.join('')}</svg>`;
}

    <div class="row" style="margin-top:24px"><button class="btn sec" data-a="freset">Reset</button><button class="btn" data-a="closesheet">Show ${filtered().length} results</button></div>`;
  }
  if(S.sheet==='offer'){
    const x=L(S.cur);
    b=`<h3>Make an offer</h3><div class="sub">Listed at ${money(x.p,x.unit)}</div>
    <div class="field" style="margin:16px 0"><span style="color:var(--g4);font-weight:600">HK$</span><input id="ov" inputmode="numeric" placeholder="${Math.round(x.p*.9)}" autofocus></div>
    <div class="chips wrap" style="margin-bottom:18px">${[.9,.8,.7].map(f=>`<button class="chip" data-a="quickoffer" data-v="${Math.round(x.p*f)}">HK$${Math.round(x.p*f)}</button>`).join('')}</div>
    <button class="btn" data-a="sendoffer">Send Offer</button>`;
  }
  if(S.sheet==='report'){
    b=`<div class="opt" style="pointer-events:none;font-weight:700;border:0;padding-bottom:0"><span>Safety</span></div>
    <button class="opt" data-a="report">${ic('flag',22)}<span>Report this listing</span></button>
    <button class="opt" data-a="block">${ic('block',22)}<span>Block this user</span></button>
    <button class="opt" data-a="closesheet">${ic('x',22)}<span>Cancel</span></button>`;
  }
  return`<div class="scrim" data-a="closesheet"></div><div class="sheet"><div class="grab"></div>${b}</div>`;
}

/* ---------- render ---------- */
const SCREENS={login:Login,home:Home,detail:Detail,chat:Chat,schedule:Schedule,confirm:Confirm,rate:Rate,post:Post,messages:Messages,profile:Profile};
function render(){
  const keep=document.activeElement&&document.activeElement.id;
  root.innerHTML=SCREENS[S.screen]()+Sheet()+(S.toast?`<div class="toast">${ic('check',16,'none',2.4)} ${S.toast}</div>`:'');
  const sc=root.firstElementChild;
  if(sc&&S._ls===S.screen)sc.style.animation='none';
  const sh=root.querySelector('.sheet');
  if(sh&&S._lsh===S.sheet){sh.style.animation='none';root.querySelector('.scrim').style.animation='none'}
  S._ls=S.screen;S._lsh=S.sheet;
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
  if(S.screen==='login'&&S.otpStage){const o=document.querySelector('.oi');if(o&&!root.querySelector('.oi:focus'))o.focus()}
}

/* ---------- chat logic ---------- */
function sellerReply(delay,fn){
  S.typing=true;render();
  setTimeout(()=>{S.typing=false;fn();render();},delay);
}
function pushMsg(id,m){const c=ensureChat(id);c.msgs.push({ts:now(),...m})}
function sendMsg(txt){
  const id=S.cur;pushMsg(id,{w:'me',t:txt});render();
  sellerReply(1100,()=>{pushMsg(id,{w:'them',t:/available|still/i.test(txt)?'Yes, it is still available!':'Sure! Lobby pickup works for me.'})});
}
function sendOffer(v){
  const id=S.cur,x=L(id);v=parseInt(v);if(!v||v<=0){toast('Enter a valid amount');return}
  S.sheet=null;pushMsg(id,{w:'me',offer:v});render();
  sellerReply(1300,()=>{
    if(v>=x.p*.8){ensureChat(id).agreed=v;pushMsg(id,{w:'them',t:`Deal at ${money(v)}. Let's set a pickup time.`});pushMsg(id,{card:1})}
    else pushMsg(id,{w:'them',t:`That's a bit low. Could you do ${money(Math.ceil(x.p*.9/10)*10)}?`});
  });
}

/* ---------- events ---------- */
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v,id=+el.dataset.id;
  if(a==='fav'){e.stopPropagation();S.fav.has(id)?S.fav.delete(id):S.fav.add(id);render();return}
  switch(a){
   case'sendcode':{
     const em=document.getElementById('email').value.trim().toLowerCase();
     if(!/^[^@\s]+@(my\.)?cityu\.edu\.hk$/.test(em)){S.email=em;S.err=true;render();return}
     S.email=em;S.err=false;S.otpStage=true;render();break}
   case'resend':toast('Code resent');break;
   case'editmail':S.otpStage=false;render();break;
   case'back':back();break;
   case'go':go(v);break;
   case'tab':S.hist=[];S.screen=v;S.sheet=null;render();break;
   case'type':S.type=v;S.cat='All';render();break;
   case'cat':S.cat=v;render();break;
   case'focussearch':document.getElementById('q')?.focus();break;
   case'sheet':S.sheet=el.dataset.s;render();if(S.sheet==='offer')setTimeout(()=>document.getElementById('ov')?.focus(),50);break;
   case'closesheet':S.sheet=null;render();break;
   case'fcond':{const i=S.F.cond.indexOf(v);i<0?S.F.cond.push(v):S.F.cond.splice(i,1);render();break}
   case'fsort':S.F.sort=v;render();break;
   case'freset':S.F={max:5000,cond:[],sort:'new'};render();break;
   case'open':S.cur=id;go('detail');break;
   case'startchat':ensureChat(S.cur);go('chat');break;
   case'openchat':S.cur=id;S.chats[id].unread=0;go('chat');break;
   case'sendmsg':{const i=document.getElementById('msg');const t=i.value.trim();if(t){sendMsg(t);setTimeout(()=>document.getElementById('msg')?.focus(),30)}break}
   case'quickoffer':document.getElementById('ov').value=v;break;
   case'sendoffer':sendOffer(document.getElementById('ov').value);break;
   case'spot':S.pickup.spot=v;render();break;
   case'day':S.pickup.day=v;render();break;
   case'time':S.pickup.time=v;render();break;
   case'confirmpickup':{
     const id=S.cur,p=S.pickup;
     pushMsg(id,{sys:1,t:`Pickup proposed: ${p.day} ${p.time}, ${p.spot}`});
     S.screen='chat';S.hist.pop();render();
     sellerReply(1400,()=>{ensureChat(id).pickup={...p};pushMsg(id,{sys:1,icon:'check',t:'Seller accepted the pickup time'});pushMsg(id,{w:'them',t:'Works for me. See you in the lobby!'})});
     break}
   case'scan':S.handover=true;render();toast('Seller scanned your QR');break;
   case'star':S.rate=+v;render();break;
   case'rtag':{const i=S.rateTags.indexOf(v);i<0?S.rateTags.push(v):S.rateTags.splice(i,1);render();break}
   case'submitrate':S.rate=0;S.rateTags=[];S.handover=false;S.hist=[];S.screen='home';S.sheet=null;render();toast('Thanks! Rating submitted');break;
   case'pf':S.post[el.dataset.k]=v;savePost();render();break;
   case'publish':{
     savePost();const p=S.post;
     if(!p.title||!+p.price){toast('Add a title and price');return}
     LISTINGS.unshift({id:Date.now()%100000,t:p.title,p:+p.price,cond:p.cond,cat:p.cat,type:'goods',s:'alex',mine:1,d:p.desc||'No description.',spots:[p.spot],age:'Just now'});
     S.post={title:'',price:'',cat:'Furniture',cond:'Good',spot:'Hall Lobby',desc:''};
     S.hist=[];S.screen='home';S.type='goods';S.cat='All';render();toast('Listing posted');break}
   case'report':S.sheet=null;render();toast('Reported. Our moderators will review it');break;
   case'block':S.sheet=null;render();toast('User blocked');break;
   case'toast':toast(v);break;
   case'logout':Object.assign(S,{screen:'login',hist:[],otpStage:false,email:''});render();break;
  }
});
function savePost(){
  const g=i=>document.getElementById(i);
  if(g('pt'))S.post.title=g('pt').value;if(g('pp'))S.post.price=g('pp').value;if(g('pd'))S.post.desc=g('pd').value;
}
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;document.getElementById('grid').innerHTML=gridHTML()}
  if(t.id==='rng'){S.F.max=+t.value;t.parentElement.querySelector('label b').textContent=S.F.max>=5000?'Any':money(S.F.max);const b=t.parentElement.querySelector('.btn:not(.sec)');if(b)b.textContent=`Show ${filtered().length} results`}
  if(t.classList.contains('oi')){
    t.value=t.value.replace(/\D/g,'');t.classList.toggle('f',!!t.value);
    const all=[...document.querySelectorAll('.oi')],i=+t.dataset.i;
    if(t.value&&all[i+1])all[i+1].focus();
    if(all.every(o=>o.value)){setTimeout(()=>{S.otpStage=false;S.hist=[];S.screen='home';render();toast('Verified. Welcome to CampusSwap')},250)}
  }
});
root.addEventListener('keydown',e=>{
  if(e.target.id==='msg'&&e.key==='Enter'){const t=e.target.value.trim();if(t){sendMsg(t);setTimeout(()=>document.getElementById('msg')?.focus(),30)}}
  if(e.target.id==='email'&&e.key==='Enter')root.querySelector('[data-a=sendcode]')?.click();
  if(e.target.id==='ov'&&e.key==='Enter')sendOffer(e.target.value);
  if(e.target.classList.contains('oi')&&e.key==='Backspace'&&!e.target.value){const all=[...document.querySelectorAll('.oi')],i=+e.target.dataset.i;if(all[i-1])all[i-1].focus()}
});
render();
</script>
</body>
</html>
